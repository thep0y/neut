name: "PR Check"

on:
    pull_request:
        branches:
            - main
        paths:
            - ".github/workflows/pr-check.yml"
            - "src/**"
            - "package.json"
            - "bun.lockb"
            - "bunfig.toml"
            - "tsconfig.json"
            - "vite.config.ts"
            - "vitest.config.ts"
            - "vitest.setup.ts"
            - "biome.json"
            - "TESTING.md"

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    frontend-check:
        name: "Frontend Code Check"
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Biome CLI
              uses: biomejs/setup-biome@v2

            - name: Cache frontend dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun
                      node_modules/
                  key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lockb', '**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-

            - name: Install dependencies
              run: bun install

            - name: Run check script
              run: bun run check

            # 门禁：覆盖率四项指标必须 100%（见 TESTING.md §1/§9）
            - name: Test with coverage
              run: bun run test:coverage

            # 反作弊检查：禁止 .only / .skip 与覆盖率屏蔽注释（见 TESTING.md §4.7/§9）
            - name: Guard against test cheating
              run: |
                if grep -rnE '(it|describe|test)\.(only|skip|todo)\(' tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到 .only / .skip / .todo，见 TESTING.md §4.7"
                  exit 1
                fi
                if grep -rnE '(istanbul|v8|c8) ignore' tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到覆盖率屏蔽注释，见 TESTING.md §9"
                  exit 1
                fi

            - name: Build frontend
              run: bun run build

    # 自动合并PR
    auto-merge:
        name: "Auto Merge PR"
        runs-on: ubuntu-24.04
        needs: [frontend-check]
        if: always() && !cancelled() && !failure()
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Auto merge PR
              uses: pascalgn/automerge-action@v0.16.4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MERGE_REMOVE_LABELS: "automerge"
