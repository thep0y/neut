name: "PR Check"

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - ".github/workflows/pr-check.yml"
            - "src/**"
            - "packages/positioner/**"
            - "package.json"
            - "packages/*/package.json"
            - "bun.lock"
            - "bun.lockb"
            - "bunfig.toml"
            - "tsconfig.json"
            - "vite.config.ts"
            - "vitest.config.ts"
            - "vitest.setup.ts"
            - "biome.json"
            - "TESTING.md"
            - ".github/scripts/**"

# 同一个 PR 只保留最新一次运行：新提交会取消旧的完整检查，避免排队浪费。
concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    check:
        name: "Static checks"
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: biomejs/setup-biome@v2

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun
                      node_modules/
                  key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-

            - name: Install dependencies
              run: bun install

            - name: Run static checks
              run: bun run check

    tests:
        name: "Tests & coverage"
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun
                      node_modules/
                  key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-

            - name: Install dependencies
              run: bun install

            - name: Run tests with coverage
              id: coverage
              run: bun run test:coverage

            - name: Check coverage gaps (real code)
              if: always()
              run: bun run check:branches

            - name: Guard against test cheating
              run: |
                if grep -rnE '(it|describe|test)\.(only|skip|todo)\(' tests packages/positioner/tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到 .only / .skip / .todo，见 TESTING.md §4.7"
                  exit 1
                fi
                if grep -rnE '(istanbul|v8|c8) ignore' tests packages/positioner/tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到覆盖率屏蔽注释，见 TESTING.md §9"
                  exit 1
                fi

            - name: Guard against dropped classList
              run: node .github/scripts/check-classlist.mjs

            - name: Upload coverage report
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7
                  if-no-files-found: ignore

    build:
        name: "Build"
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun
                      node_modules/
                  key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-

            - name: Install dependencies
              run: bun install

            - name: Build positioner package
              run: bun run build:positioner

            - name: Build frontend
              run: bun run build

    coverage-comment:
        name: "Coverage comment"
        needs: [tests]
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Download coverage report
              uses: actions/download-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  if-no-files-found: ignore

            - name: Post coverage comment
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COVERAGE_OUTCOME: ${{ needs.tests.result }}
              run: node .github/scripts/coverage-comment.mjs --post

    auto-merge:
        name: "Auto Merge PR"
        runs-on: ubuntu-24.04
        needs: [check, tests, build]
        if: always() && !cancelled() && !failure()
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: pascalgn/automerge-action@v0.16.4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MERGE_REMOVE_LABELS: "automerge"
