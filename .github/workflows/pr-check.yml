name: "PR Check"

on:
    pull_request:
        branches:
            - main
        paths:
            - ".github/workflows/pr-check.yml"
            - "src/**"
            - "package.json"
            - "bun.lockb"
            - "bunfig.toml"
            - "tsconfig.json"
            - "vite.config.ts"
            - "vitest.config.ts"
            - "vitest.setup.ts"
            - "biome.json"
            - "TESTING.md"
            - ".github/scripts/**"

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    frontend-check:
        name: "Frontend Code Check"
        runs-on: ubuntu-24.04
        # 需要在 PR 上发/更新覆盖率评论（fork PR 只有只读 token，见下面的步骤说明）
        permissions:
            contents: read
            pull-requests: write
        steps:
            # fetch-depth: 0 让脚本能 `git diff <base>...HEAD` 列出本 PR 改动的文件
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Biome CLI
              uses: biomejs/setup-biome@v2

            - name: Cache frontend dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun
                      node_modules/
                  key: ${{ runner.os }}-frontend-${{ hashFiles('**/bun.lockb', '**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-frontend-

            - name: Install dependencies
              run: bun install

            - name: Run check script
              run: bun run check

            # 快速反馈：只跑受本 PR 影响的测试（不校验覆盖率，见 TESTING.md §10）。
            # 放在全量覆盖率之前，改一个组件时几十秒就能知道有没有跑挂，
            # 不必等全量；真正的门禁仍是下面的 Test with coverage。
            - name: Test affected files (fast feedback)
              run: bun run test:affected -- --base ${{ github.event.pull_request.base.sha }}
              continue-on-error: true

            # 门禁：跑覆盖率并生成报告（函数 100% 由 vitest 阈值把关；
            # 语句/分支/行改由下一步的"真实缺口零遗漏"脚本把关，见 TESTING.md §8）
            - name: Test with coverage
              id: coverage
              run: bun run test:coverage

            # 门禁：任何未覆盖的语句/分支/函数，若不对应 Solid 的 JSX 编译归因产物、
            # 也不是已登记原因的不可达防御代码，一律失败（见 TESTING.md §8）。
            # if: always() —— 覆盖率步骤本身不达标时，更需要看到具体是哪些真实缺口；
            # 但这一步自己失败同样是门禁失败。
            - name: Check coverage gaps (real code)
              run: bun run check:branches

            # 反作弊检查：禁止 .only / .skip 与覆盖率屏蔽注释（见 TESTING.md §4.7/§9）
            - name: Guard against test cheating
              run: |
                if grep -rnE '(it|describe|test)\.(only|skip|todo)\(' tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到 .only / .skip / .todo，见 TESTING.md §4.7"
                  exit 1
                fi
                if grep -rnE '(istanbul|v8|c8) ignore' tests --include='*.test.ts' --include='*.test.tsx'; then
                  echo "::error::检测到覆盖率屏蔽注释，见 TESTING.md §9"
                  exit 1
                fi

            # 组件约定守卫：splitProps 拿走了 classList 就必须真正应用（见 TESTING.md §9）
            - name: Guard against dropped classList
              run: node .github/scripts/check-classlist.mjs

            - name: Build frontend
              run: bun run build

            # 把覆盖率结果作为 PR 评论（同一个 PR 上原地更新，不刷屏）。
            # if: always() —— 正因为没达标才更需要看到报告；
            # continue-on-error —— fork PR 的 token 是只读的，发不出去不该让门禁再多一条红。
            - name: Post coverage comment
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
              run: node .github/scripts/coverage-comment.mjs --post

            # 覆盖率报告留档：评论里只放摘要，明细（lcov-report 的 HTML）在这里
            - name: Upload coverage report
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7
                  if-no-files-found: ignore

    # 自动合并PR
    auto-merge:
        name: "Auto Merge PR"
        runs-on: ubuntu-24.04
        needs: [frontend-check]
        if: always() && !cancelled() && !failure()
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Auto merge PR
              uses: pascalgn/automerge-action@v0.16.4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MERGE_REMOVE_LABELS: "automerge"
